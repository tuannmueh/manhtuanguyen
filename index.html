<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri Ân Thầy Cô 20/11 - Chúc Mừng Ngày Nhà Giáo Việt Nam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Khung tiêu đề chính */
        .header-title {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 90%;
        }

        .header-title h1 {
            font-size: 2.5rem;
            color: #b91c1c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 8px;
            animation: heartbeat 2s infinite ease-in-out;
        }

        .header-title p {
            font-size: 1.1rem;
            color: #4b5563;
            font-style: italic;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Nút điều khiển nhạc */
        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background-color: #ffffff;
            color: #db2777;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #music-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        /* Style chung cho Bong bóng */
        .bubble {
            position: absolute;
            bottom: -100px;
            cursor: pointer;
            will-change: transform, opacity;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        /* Các hình dạng bong bóng bằng cách tạo hiệu ứng trong suốt lấp lánh */
        .shape-circle {
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(219,39,119,0.3) 50%, rgba(131,24,67,0.6) 100%);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .shape-heart {
            background: linear-gradient(135deg, rgba(244,63,94,0.7) 0%, rgba(225,29,72,0.4) 100%);
            clip-path: path('M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z');
            transform-origin: center;
        }

        .shape-star {
            background: linear-gradient(135deg, rgba(250,204,21,0.8) 0%, rgba(234,179,8,0.4) 100%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .shape-flower {
            background: linear-gradient(135deg, rgba(192,132,252,0.8) 0%, rgba(147,51,234,0.4) 100%);
            clip-path: path('M12,2C10.9,2 10,2.9 10,4C10,4.3 10.1,4.6 10.2,4.8C9.3,4.4 8.2,4.5 7.4,5.1C6.5,5.7 6,6.8 6,7.8C5.1,7.5 4.1,7.8 3.5,8.6C2.9,9.4 2.8,10.5 3.3,11.3C2.5,11.8 2,12.8 2,13.8C2,14.9 2.5,15.9 3.3,16.4C2.8,17.2 2.9,18.3 3.5,19.1C4.1,19.9 5.1,20.2 6,19.9C6,20.9 6.5,22 7.4,22.6C8.2,23.2 9.3,23.3 10.2,22.9C10.1,23.1 10,23.4 10,23.7C10,24.8 10.9,25.7 12,25.7C13.1,25.7 14,24.8 14,23.7C14,23.4 13.9,23.1 13.8,22.9C14.7,23.3 15.8,23.2 16.6,22.6C17.5,22 18,20.9 18,19.9C18.9,20.2 19.9,19.9 20.5,19.1C21.1,18.3 21.2,17.2 20.7,16.4C21.5,15.9 22,14.9 22,13.8C22,12.8 21.5,11.8 20.7,11.3C21.2,10.5 21.1,9.4 20.5,8.6C19.9,7.8 18.9,7.5 18,7.8C18,6.8 17.5,5.7 16.6,5.1C15.8,4.5 14.7,4.4 13.8,4.8C13.9,4.6 14,4.3 14,4C14,2.9 13.1,2 12,2Z');
            transform-origin: center;
        }

        /* Hạt bụi màu bay ra khi bong bóng nổ */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* Hộp thoại câu chúc hiển thị khi nổ */
        .wish-text {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: #1e3a8a;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            white-space: nowrap;
            z-index: 50;
            text-align: center;
            transform: translate(-50%, -50%);
            animation: flyUpFade 2s forwards ease-out;
            border-left: 5px solid #db2777;
        }

        @keyframes flyUpFade {
            0% {
                transform: translate(-50%, -50%) translateY(0) scale(0.7);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, -50%) translateY(-20px) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) translateY(-120px) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>Tri Ân Thầy Cô 20/11</h1>
        <p>Nhấp vào những chiếc bong bóng lấp lánh để đón nhận lời chúc tri ân</p>
    </div>

    <button id="music-btn">🎵 Bật Nhạc Nền</button>

    <!-- Thẻ chứa nhạc nền từ kho lưu trữ âm nhạc mở -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');
        let isMusicPlaying = false;

        // Bật / tắt nhạc nền khi click nút
        musicBtn.addEventListener('click', () => {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.innerText = "⏸ Tắt Nhạc Nền";
                }).catch(err => console.log("Yêu cầu thao tác tương tác trước khi phát nhạc:", err));
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicBtn.innerText = "🎵 Bật Nhạc Nền";
            }
        });

        // Danh sách lời chúc 20/11
        const wishes = [
            "Chúc mừng ngày Nhà giáo Việt Nam 20/11! 💐",
            "Tôn sư trọng đạo - Tri ân thầy cô! ❤️",
            "Kính chúc thầy cô luôn mạnh khỏe và hạnh phúc! 🌟",
            "Cảm ơn thầy cô đã chắp cánh ước mơ cho chúng em! 🕊️",
            "Chúc thầy cô luôn tràn đầy nhiệt huyết với sự nghiệp trồng người! 📖",
            "Dưới ánh mặt trời, không có nghề nào cao quý hơn nghề dạy học. ☀️",
            "Chúc thầy cô một ngày 20/11 trọn vẹn niềm vui và nụ cười! 🎉",
            "Biết ơn người đưa đò thầm lặng qua bao thế hệ học trò! 🛶"
        ];

        // Tạo tiếng nổ "Pop" kỹ thuật số bằng Web Audio API
        function playPopSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.log("AudioContext chưa được kích hoạt từ trình duyệt:", e);
            }
        }

        // Tạo cấu trúc cho bong bóng rơi tự do
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');

            const shapes = ['circle', 'heart', 'star', 'flower'];
            const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
            bubble.classList.add(`shape-${randomShape}`);

            // Thiết lập tỷ lệ hiển thị cho clip-path
            let size = Math.floor(Math.random() * 30) + 45; // Kích thước từ 45px đến 75px
            if (randomShape === 'heart' || randomShape === 'flower') {
                size = Math.floor(Math.random() * 20) + 55; // Tăng kích thước chuẩn cho path SVG
            }
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;

            const posX = Math.random() * (window.innerWidth - size);
            bubble.style.left = `${posX}px`;

            const duration = Math.random() * 4 + 6; // Thời gian bay từ 6s đến 10s
            const swayAmplitude = Math.random() * 25 + 15; // Biên độ lắc ngang
            const swaySpeed = Math.random() * 1.5 + 1; // Tần suất lắc lư

            document.body.appendChild(bubble);

            let startTime = null;
            let bubblePopped = false;

            function updateAnimation(timestamp) {
                if (bubblePopped) return;
                if (!startTime) startTime = timestamp;
                const elapsed = (timestamp - startTime) / 1000;

                const progress = elapsed / duration;
                const posY = window.innerHeight - (progress * (window.innerHeight + size + 150));
                const currentSway = Math.sin(elapsed * swaySpeed) * swayAmplitude;
                
                bubble.style.transform = `translate3d(${currentSway}px, ${posY}px, 0)`;

                if (posY < -size - 50) {
                    bubble.remove();
                } else {
                    requestAnimationFrame(updateAnimation);
                }
            }
            requestAnimationFrame(updateAnimation);

            // Hàm xử lý kích nổ bong bóng
            function popBubble(e) {
                if (bubblePopped) return;
                bubblePopped = true;

                const rect = bubble.getBoundingClientRect();
                const clickX = rect.left + rect.width / 2;
                const clickY = rect.top + rect.height / 2;

                playPopSound();
                createExplosion(clickX, clickY, randomShape);
                showWish(clickX, clickY);

                bubble.remove();
            }

            bubble.addEventListener('mousedown', popBubble);
            bubble.addEventListener('touchstart', (e) => {
                e.preventDefault();
                popBubble(e);
            });
        }

        // Tạo hiệu ứng hạt vỡ vụn màu sắc khi nổ
        function createExplosion(x, y, shape) {
            const particleCount = 12;
            let color = 'rgba(219,39,119,0.6)';
            
            if (shape === 'star') color = 'rgba(234,179,8,0.7)';
            if (shape === 'flower') color = 'rgba(147,51,234,0.6)';

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const pSize = Math.random() * 5 + 4;
                particle.style.width = `${pSize}px`;
                particle.style.height = `${pSize}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = color;

                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 70 + 30;
                const vX = Math.cos(angle) * velocity;
                const vY = Math.sin(angle) * velocity;

                let pStartTime = null;
                const pDuration = 500;

                function animateParticle(timestamp) {
                    if (!pStartTime) pStartTime = timestamp;
                    const elapsed = timestamp - pStartTime;
                    const progress = elapsed / pDuration;

                    if (progress >= 1) {
                        particle.remove();
                    } else {
                        const curX = x + vX * progress;
                        const curY = y + vY * progress + (progress * progress * 20);
                        particle.style.transform = `translate3d(${curX - x}px, ${curY - y}px, 0)`;
                        particle.style.opacity = 1 - progress;
                        requestAnimationFrame(animateParticle);
                    }
                }
                requestAnimationFrame(animateParticle);
            }
        }

        // Tạo khung chữ bay lên chứa nội dung chúc mừng
        function showWish(x, y) {
            const wish = document.createElement('div');
            wish.classList.add('wish-text');
            
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            wish.innerText = randomWish;

            wish.style.left = `${x}px`;
            wish.style.top = `${y}px`;

            document.body.appendChild(wish);

            setTimeout(() => {
                wish.remove();
            }, 2000);
        }

        // Điều phối chu kỳ xuất hiện liên tục của bong bóng
        setInterval(createBubble, 800);

        // Khởi tạo các bong bóng ban đầu ngay khi tải xong giao diện
        window.addEventListener('DOMContentLoaded', () => {
            for(let i = 0; i < 4; i++) {
                setTimeout(createBubble, i * 400);
            }
        });
    </script>
</body>
</html>
